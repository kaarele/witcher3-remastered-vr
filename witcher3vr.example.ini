[meta]
config_version=16

[openxr]
enabled=1
; 1 = clean mono: one cyclopean REDengine render, published identically to
; both OpenXR views with each view's native asymmetric runtime FOV.
; 3 = Mode-3 geometry stereo (AER + AFW or complete-pair Stereo).
mode=3
mode3_aer_presentation=1
resolution_auto=1
render_width=2688
render_height=2784
resolution_scale=1.0
presentation_scale=1.000
world_detail_range=1.000
native_stereo=1
fullscreen_projection=0
hud_horizontal_scale=1.000
hud_vertical_scale=1.000
hud_stereo_shift_px=-36
hud_size=1.000
; 5.01: the game's fade to black is drawn into the HUD texture, so in VR it
; shows as a black HUD-sized rectangle. remove = drop that fill (the world
; stays visible), uniform = darken each whole eye image with the fade instead,
; native = the game's own draw. Menus, loading screens and Cinema panels always
; keep the native fade.
hud_fade_mode=remove
menu_scale=0.850
menu_distance=1.20
cinema_scale=0.900
cinema_render_stereo_strength=0.250
cinema_hud_stereo_shift_px=-72
cinema_hud_scale=1.300
manual_cinema_hud_scale=1.600
full_vr_hud_stereo_shift_px=-36
full_vr_hud_scale=1.000
; Supported values: 5x4, 4x3, 16x10, 16x9.
cinema_aspect=5x4
cinema_5x4=1
cinema_full_vr=1
; 1 = the HMD recenter at the start of a cutscene is undone when gameplay
; resumes, so gameplay keeps the forward direction it had before.
cinema_restore_gameplay_recenter=1
; 1 = recenter when the OpenXR runtime recenters (LOCAL space change).
follow_runtime_recenter=0
steady_icons=0
hmd_freelook=1
hmd_compositor_only=0
disable_desktop_vsync=1
pipeline_frame_wait=1
; Strict Stereo only: 1 waits for and begins the next pair's OpenXR frame right
; after xrEndFrame (standard OpenXR loop order) instead of inline before that
; pair is submitted, so the runtime's pacer sees the real frame time and stops
; sleeping every pair to a display slot when the game is slower than one period.
frame_wait_early=0
; Strict Stereo: hold each stereo pair to exactly N display periods (0 = off) so
; every pair stays on the headset for the same number of refreshes. 2 = 45/s at
; 90 Hz, 40/s at 80 Hz, 36/s at 72 Hz; 3 = 40/s at 120 Hz, 30/s at 90 Hz. Pick a
; rate the game can hold; a slower pair is never held further. Experimental: the cap
; is not aligned to the display yet and measured less even than running free.
pair_rate_divisor=0
hmd_yaw_scale=1.0
hmd_pitch_scale=1.0
hmd_roll_scale=-1.0
hmd_fov_scale=1.0
hmd_lock_game_pitch=1
vertical_pitch_enabled=0
hmd_position_scale=1.0
mono_neck_pivot_compensation_m=0.10
mono_eye_shift_px=320
mono_eye_shift_auto=1
world_marker_game_pitch_gain=0.15
world_marker_hmd_vertical_gain=1.9
world_marker_game_pitch_depth_enabled=1
world_marker_game_pitch_depth_scale=-0.033333
world_marker_vertical_offset_ndc=0.24
; 5.01 only. 1 = hook CameraDirector.WorldVectorToViewRatio; with the
; controller-locked level HUD (hud_controller_locked=1, hud_anchor_level=1)
; in Stereo, world markers are projected through the HUD plane itself, so
; they sit in the direction of their anchor (no tuned gains; the five
; world_marker_* gains above then apply only to the other HUD routes).
; 0 = leave the native alone (vanilla markers). 4.04 ignores it.
world_marker_exact_projection=1
; 5.01 only. 1 = the HUD centre square (crosshair) is drawn about the render
; centre only while the aim crosshair is drawn; 0 = always (markers crossing
; the centre then jump up when hud_size < 1 with hud_scale_origin=visible).
hud_centre_split_aim_only=1

[reverse]
enabled=0
scan_periodic=0
scan_unmap=0
cbv_probe=0
scan_interval_frames=600
max_scan_bytes=65536
max_matrix_logs=32
execute_log_interval=0
log_buffer_max_bytes=262144
draw_sample_interval=1000
max_roots=16
active_nudge=0
nudge_amount=0.25
nudge_start_frame=1800
nudge_cycle_frames=240
nudge_pulse_frames=120
orbit_probe=0
orbit_frame_interval=2
orbit_max_logs=2400
copy_probe=0
copy_max_logs=400
stereo_probe=0
geometry_shift=0

[engine]
temporal_backend=dlss
raytracing_enabled=0
; Per-eye RTX temporal history buffers shared by AO, shadows, and reflections (4-16).
raytracing_history_buffers=8
; 5.01 local lights and local shadows per eye. All defaults keep the game's own behaviour.
; remaster_local_light_diag=1 logs, per eye and stereo pair, which local lights cast
; shadows at what atlas size, atlas overflows, and LLDIFF lines when the eyes disagree.
remaster_local_light_diag=0
; Dynamic local-shadow atlas slices of 2048x2048 (1-4; 1 keeps the game's value).
; 4 costs about 24-48 MB more VRAM. Read when the renderer creates its shadow manager.
remaster_local_shadow_slices=1
; 1 = pack the biggest (nearest) shadowed lights first, so an overflow drops far lights.
remaster_local_shadow_sort_corrected=0
; 1 = advance flickering lights (torches, candles, fires) once per stereo pair instead of
; once per eye: flat-game flicker speed and the same flicker state in both eyes.
remaster_light_flicker_per_pair=0
; 1 = size and fade local shadows in both eyes from the first eye's position.
remaster_local_light_pair_lock=0
dlss_dlaa=0
dual_render_probe=1
dual_render_start=1
sync_swap_eyes=0
menu_state_probe=1
view_probe=0
frame_builder_probe=0
gameplay_entry_probe=0
scene_enqueue_probe=0
view_factory_probe=0
frame_factory_probe=0
animation_hmd_frustum=0
; 4.04 and 5.01. 1 = characters outside the game camera's view keep their full animation
; update while the headset view is active (the game skips skinning them, so people you look
; at with your head stood frozen or in a T-pose); needs menu_state_probe=1. Costs CPU with
; many characters. The census log adds a "PERF anim visibility" line. 0 = game behaviour.
animated_component_visible=1
taau_reverse_eye_order=0
taau_first_eye_pure_camera_motion=1
taau_pure_camera_motion_all=1
taau_activation_delay_frames=30
native_projection_shift=0
native_projection_shift_px=8
native_stereo_offset=0.0
factory_stereo_offset=0.064
; F8 toggles 0 (game shoulder camera) and 1 (VR centred). Mode 1 moves the
; camera by close_camera_offset along the heading (negative = farther) and
; centres Geralt: camera_center 0..1 is the strength, smoothed over
; camera_center_smoothing_seconds; lateral offsets above camera_center_max_m
; are not trusted (the camera returns to the shoulder position).
camera_mode=0
close_camera_offset=0.750
camera_center=1.000
camera_center_smoothing_seconds=0.300
camera_center_max_m=1.500
first_person_camera_offset=1.880000
first_person_camera_right_offset=-0.740000
first_person_camera_up_offset=-0.345000
first_person_camera_eye_nudge=0.000000
first_person_camera_horizontal_forward_offset=0.750000
first_person_camera_world_z_offset=0.650000
first_person_dynamic_anchor=0
first_person_state_offsets=1
first_person_idle_forward_offset=0.100000
first_person_slow_walk_forward_offset=0.650000
first_person_indoor_walk_forward_offset=0.000000
first_person_walk_forward_offset=0.650000
first_person_sprint_forward_offset=1.050000
first_person_sprint_right_offset=0.220000
first_person_sprint_world_z_offset=0.450000
first_person_horse_idle_forward_offset=0.750000
first_person_horse_walk_forward_offset=0.850000
first_person_horse_trot_forward_offset=0.950000
first_person_horse_gallop_forward_offset=1.050000
first_person_state_transition_seconds=0.080000
first_person_sprint_release_hold_seconds=0.100000
first_person_stop_hold_seconds=0.500000
first_person_lock_game_pitch=1
first_person_low_position_pitch_reference=-38.000000
first_person_pitch_vertical_compensation=0.001000
first_person_anchor_smoothing=1
first_person_anchor_smoothing_seconds=0.200000
first_person_strafe=1
first_person_snap_turn=0
first_person_snap_turn_degrees=45
first_person_snap_turn_activation=0.550000
first_person_snap_turn_release=0.200000
first_person_hmd_body_follow=0
; F11 into first person recenters, so walking follows where you look.
first_person_recenter_on_entry=1
; 5.01: eye at the animated head and head hiding (head-bone natives).
remaster_native_head_provider=0
first_person_stationary_turn=1
first_person_combat_exit=0
first_person_combat_return_delay_seconds=10.000000
streamline_force_reset=0
streamline_trace=0
streamline_trace_start_frame=500
streamline_taau_bridge=1
ngx_trace=0
# Legacy compatibility key retained for old INIs. V1289 always uses the public
# Streamline completion route for Mode-3 DLSS; this value no longer selects a
# callback and is ignored.
low_budget_dlss=0
# 5.01 Stereo only: render the sun shadow cascades once per stereo pair.
# 0 = off (default). 1 = the second render of each pair skips the cascade fit,
# caster cull and cascade depth passes and reuses the first render's shadow map
# and cascade constants (checked by a hash of the cascade set; switches itself
# off after repeated mismatches). 9 = measurement only: skips the depth passes
# but keeps each eye's own fit, so the second eye's shadows are misregistered.
remaster_shadow_pair_reuse=0
# Where the renderer fixes (smoke, foliage, focus, retained HUD, Witcher
# Senses, terrain motion, tiled lights, TAAU/RT) keep descriptor metadata.
# shadow (default): one address-ordered store that follows the game's
# descriptor copies range by range instead of hashing every descriptor.
# legacy: the previous hashed tables, kept for comparison runs and as a
# fallback. Read whatever the [debug] switches say.
descriptor_metadata_store=shadow
# Strict Stereo: after queueing an eye pair the game thread waits until the
# render thread has finished both eyes. It spins this many pause instructions
# (4096 is roughly 60-130 us) before it sleeps until woken. 0 restores the old
# spin timed with QueryPerformanceCounter (~200 us; under Proton every check
# of the clock is a syscall).
pair_barrier_spin_pauses=4096

[renderdoc]
# Optional in-process capture. When disabled, an adjacent renderdoc.dll is not loaded.
# Set to 1 and restart the game; F3 captures the next presented frame.
enabled=0
# Diagnostic only: wrap Streamline's D3D12 device for full D3D12 capture.
# This may reduce normal frame rate even while no capture is active.
streamline_device_bridge=0

[debug]
# Heavy diagnostics are separate from the two lightweight flight recorders.
logging_enabled=0
runtime_diagnostics=0
# Independent lightweight CPU/GPU phase recorder; F3 dumps the last 10 seconds.
# V1346: V1343 renderer/HUD plus validated boat, gallop, Vertical Pitch/F9 and Cinema 5:4, 4:3, 16:10, 16:9 controls.
pipeline_flight_recorder=0
route_flight_recorder=0
taau_drop_diagnostics=0
cinema_camera_diagnostics=0
first_person_state_diagnostics=0
first_person_aim_diagnostics=0
# With logging: on 5.01's exact marker route, one "World marker exact" line
# every 30 presents (400 at most: world point, view ratio, expected and
# displayed HUD-plane tangent) and "HUD centre split" state changes (64).
world_marker_diagnostics=0

[vrs]
# Variable rate shading (D3D12 only; needs VRS Tier 1 or newer).
# 0 = off (default; nothing is hooked). 3 = measurement only: shades the scene
# passes at one uniform coarse rate everywhere, centre included; not for play.
# 1 and 2 are reserved for the foveated modes.
mode=0
# Mode 3 rate: 1x1, 1x2, 2x1, 2x2, 2x4, 4x2 or 4x4 (the last three need
# AdditionalShadingRatesSupported, otherwise 2x2 is used). Use 1x1 for the
# baseline run: same detours and census, no shading-rate change.
uniform_rate=2x2
# PSO classes shaded at uniform_rate (any comma-separated subset).
classes=gbuffer,decal,scene_hdr
# Census lines in witcher3vr.log every 600 Presents, written whatever the
# [debug] switches say. Measure with [debug] runtime_diagnostics=0.
log=1

[perf]
# Measurement switches; they need the [vrs] census log (mode=3, log=1).
# shadow_profile=1 (5.01) times the sun-shadow stages per eye (cascade fit and
# cull, SpeedTree cascade views, RenderShadows, cascade depth passes), hashes
# the cascade set between the eyes of a pair and counts the draws recorded in
# the depth passes; PERF shadow lines in each census.
shadow_profile=0
# descriptor_shadow_verify=1 keeps both descriptor stores and compares every
# lookup: per-kind counts (+window/total) and the first differences go to the
# census lines. Slower than either store alone; not for timing runs.
descriptor_shadow_verify=0
# Experimental, 5.01 strict Stereo only; works without the census log. 0 = the
# game thread waits until the pair it just queued has rendered (original
# barrier). 1 = it waits for the pair before that one, so the next game tick
# overlaps the render (one pair of run-ahead; 4 capture slots per eye instead
# of 3). The census log adds a "PERF pair barrier" line per window. Use it
# with pair_enqueue_after_fence=1, otherwise moving characters differ per eye.
pair_barrier_lag=0
# With pair_barrier_lag=1: 1 = predict the pair's head pose as many display
# periods ahead as pairs were measured to take (1-6); 0 = keep 2 periods.
pair_pose_lead_adaptive=1
# 5.01 strict Stereo; works without the census log. 1 (default) = the extra
# eye the mod renders first is queued right after the game's own per-tick
# fence wait, where the game queues its own eye, so both eyes of a pair show
# the same animation poses also with pair_barrier_lag=1. 0 = queue it inside
# the frame factory, before that wait (old order; with pair_barrier_lag=1 the
# eye rendered second shows moving characters one game tick ahead). The
# census log adds "PERF pair enqueue" and "PERF parallel flush" lines.
pair_enqueue_after_fence=1

[focus_projection]
shader_registry_enabled=0
